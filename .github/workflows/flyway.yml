name: Flyway Migration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - feature/*

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: powellrhys-sql-server-rg          # ⬅️ Update
      SQL_SERVER: powellrhys-sqlserver          # ⬅️ Update (without .database.windows.net)
      FIREWALL_RULE_NAME: github-actions-${{ github.run_id }}  # unique per run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1️⃣ Login to Azure using the service principal JSON
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2️⃣ Get runner's public IP address
      - name: Get GitHub Runner Public IP
        id: ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT

      # 3️⃣ Add temporary firewall rule for this IP
      - name: Add Azure SQL Firewall Rule
        run: |
          az sql server firewall-rule create \
            --resource-group $RESOURCE_GROUP \
            --server $SQL_SERVER \
            --name $FIREWALL_RULE_NAME \
            --start-ip-address ${{ steps.ip.outputs.ip }} \
            --end-ip-address ${{ steps.ip.outputs.ip }}

      # 4️⃣ Run Flyway migrations
      - name: Run Flyway migrations
        uses: docker://flyway/flyway:latest
        with:
          args: >
            -url=${{ secrets.SQL_SERVER_JDBC_URL }}
            -user=${{ secrets.SQL_SERVER_USERNAME }}
            -password=${{ secrets.SQL_SERVER_PASSWORD }}
            -locations=filesystem:./sql
            -connectRetries=10
            migrate

      # 5️⃣ Always remove the firewall rule (even if migration fails)
      - name: Remove Azure SQL Firewall Rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group $RESOURCE_GROUP \
            --server $SQL_SERVER \
            --name $FIREWALL_RULE_NAME
