name: Update Fantasy Premier League Data

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/update-fpl-data.yml'
      - 'backend/**'
      - 'shared/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-fpl-data.yml'
      - 'backend/**'
      - 'shared/**'
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: update-fpl-data
  cancel-in-progress: false

jobs:
  update-fpl-data:
    name: Update Fantasy Premier League Data
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: powellrhys-sql-server-rg
      SQL_SERVER: powellrhys-sqlserver
      FIREWALL_RULE_NAME: update-data-github-action-${{ github.run_id }}

    steps:
      # Check out codebase
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      # Install Poetry
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # Install project dependencies via Poetry
      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      # Install ODBC driver
      - name: Install SQL Server ODBC driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl -o /tmp/mssql-release.list https://packages.microsoft.com/config/ubuntu/22.04/prod.list
          sudo tee /etc/apt/sources.list.d/mssql-release.list < /tmp/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install msodbcsql17 -y
          sudo apt-get install unixodbc-dev -y

      # Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS}}

      # Get runner's public IP address
      - name: Get GitHub Runner Public IP
        id: ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT

      # Add temporary firewall rule for this IP
      - name: Add Azure SQL Firewall Rule
        run: |
          az sql server firewall-rule create \
            --resource-group $RESOURCE_GROUP \
            --server $SQL_SERVER \
            --name $FIREWALL_RULE_NAME \
            --start-ip-address ${{ steps.ip.outputs.ip }} \
            --end-ip-address ${{ steps.ip.outputs.ip }}

      # Delay to ensure enough time for firewall rule to be established
      - name: Wait for propagation
        run: sleep 60

      # Run data collection script
      - name: Update Data
        env:
          league_ids: ${{ vars.LEAGUE_IDS }}
          privileged_users: ${{ secrets.PRIVILEGED_USERS }}
          database_connection_string: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: poetry run python -m backend.collect_fpl_data

      # Always remove the firewall rule (even if migration fails)
      - name: Remove Azure SQL Firewall Rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group $RESOURCE_GROUP \
            --server $SQL_SERVER \
            --name $FIREWALL_RULE_NAME
