[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fantasy-premier-league"
version = "0.1.0"
description = "Python project to display fantasy-premier-league data using streamlit"
authors = ["Rhys Powell"]
packages = [
    { include = "backend" },
    { include = "frontend" },
    { include = "shared" }
]

[tool.poetry.dependencies]
python = "^3.10"
azure-storage-blob = "12.24.0"
python-dotenv = "1.0.1"
selenium = "4.25.0"
streamlit = "1.46.0"
Authlib = "1.5.1"
statsmodels = "^0.14.2"
scipy = "*"
pandas = "2.2.3"
plotly = "6.0.1"
streamlit-components = { git = "https://github.com/powellrhys/python-streamlit-components.git", tag = "v0.1.6" }
behave = "1.2.6"
pytest = "8.3.4"
pytest-cov = "5.0.0"
sqlalchemy = "^2.0.35"
pyodbc = "^5.2.0"
greenlet = "^3.0.3"

[tool.poetry.extras]
backend = ["selenium"]
frontend = ["streamlit", "Authlib", "pandas", "plotly", "streamlit-components", "statsmodels", "scipy"]
testing = ["behave", "pytest", "pytest-cov"]
